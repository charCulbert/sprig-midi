name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The runner has no signing certificate, so builds sign ad hoc.

jobs:
  build:
    name: Build (Release)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: |
          xcodebuild build \
            -project Sprig.xcodeproj -scheme Sprig -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
          ditto -c -k --keepParent build/Build/Products/Release/Sprig.app Sprig.zip
      # ad hoc signed and not notarised: macOS blocks it on first open
      - uses: actions/upload-artifact@v4
        with:
          name: Sprig
          path: Sprig.zip

  ui:
    name: UI tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test
        run: |
          xcodebuild test \
            -project Sprig.xcodeproj -scheme Sprig \
            -destination "platform=macOS" \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath ui.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-results
          path: ui.xcresult
